name: flutter_bloc_template_workspace
publish_to: none

environment:
  sdk: ^3.10.0

workspace:
  - apps/app
  - packages/core
  - packages/network

dev_dependencies:
  melos: ^7.0.0

melos:
  scripts:
    analyze:
      description: Analyze all packages.
      run: melos exec -c 1 -- flutter analyze --fatal-infos
    format:check:
      description: Fail if any Dart file is not formatted.
      run: dart format --set-exit-if-changed .
    test:
      description: Run tests with coverage in every package that has tests.
      run: melos exec -c 1 --dir-exists=test -- flutter test --coverage
    coverage:check:
      description: Run tests, then enforce 90% coverage on the merged lcov report.
      run: melos run test && dart run tool/coverage_check.dart
